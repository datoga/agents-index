services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agents_index
      POSTGRES_USER: agents_index
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agents_index_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents_index -d agents_index"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agents_index_pg:
